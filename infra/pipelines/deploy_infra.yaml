trigger: none

parameters:
  - name: personName
    displayName: "Person/Owner Name"
    type: string
    default: 'Arthur'
  - name: location
    displayName: "Azure Region"
    type: string
    default: 'brazilsouth'
  - name: templateML
    type: string
    default: 'bicep_files/azure_ml_deploy.bicep'
  # Selection parameters for stages
  - name: runDev
    displayName: "Deploy to Dev?"
    type: boolean
    default: true
  - name: runTest
    displayName: "Deploy to Test?"
    type: boolean
    default: false
  - name: runProd
    displayName: "Deploy to Prod?"
    type: boolean
    default: false

variables:
  - group: Arthur_VG # Contains service_conn and subscription_id
  - name: rgDev
    value: 'rg-dev-${{ parameters.personName }}'
  - name: rgTest
    value: 'rg-test-${{ parameters.personName }}'
  - name: rgProd
    value: 'rg-prod-${{ parameters.personName }}'

stages:
  - stage: Lint
    displayName: 'Lint Bicep'
    jobs:
      - job: LintBicep
        steps:
          - script: az bicep build --file ${{ parameters.templateML }}
            displayName: 'Bicep Lint'

  # --- DEV STAGE ---
  - stage: Deploy_Dev
    displayName: 'Deploy to Development'
    dependsOn: Lint
    condition: and(succeeded(), eq(${{ parameters.runDev }}, true))
    variables:
      envName: 'dev'
      rgName: $(rgDev)
    jobs:
      - job: DeployJob
        steps:
          - task: AzureCLI@2
            displayName: 'Ensure Resource Group Exists'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: az group create --name $(rgName) --location ${{ parameters.location }}

          - task: AzureCLI@2
            displayName: 'Deploy Resources'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: |
                WORKSPACE_NAME=$(az deployment group create \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                  --query properties.outputs.mlWorkspaceName.value -o tsv)
                echo "##vso[task.setvariable variable=workspaceName]$WORKSPACE_NAME"

          - task: AzureCLI@2
            displayName: 'Smoke Test'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: az ml workspace show --name $(workspaceName) --resource-group $(rgName)

  # --- TEST STAGE ---
  - stage: Deploy_Test
    displayName: 'Deploy to Test'
    dependsOn: Lint
    condition: and(succeeded(), eq(${{ parameters.runTest }}, true))
    variables:
      envName: 'test'
      rgName: $(rgTest)
    jobs:
      - job: DeployJob
        steps:
          - task: AzureCLI@2
            displayName: 'Ensure Resource Group Exists'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: az group create --name $(rgName) --location ${{ parameters.location }}

          - task: AzureCLI@2
            displayName: 'Deploy Resources'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: |
                WORKSPACE_NAME=$(az deployment group create \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                  --query properties.outputs.mlWorkspaceName.value -o tsv)
                echo "##vso[task.setvariable variable=workspaceName]$WORKSPACE_NAME"

          - task: AzureCLI@2
            displayName: 'Smoke Test'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: az ml workspace show --name $(workspaceName) --resource-group $(rgName)

  # --- PROD STAGE ---
  - stage: Deploy_Prod
    displayName: 'Deploy to Production'
    dependsOn: Lint
    condition: and(succeeded(), eq(${{ parameters.runProd }}, true))
    variables:
      envName: 'prod'
      rgName: $(rgProd)
    jobs:
      - job: DeployJob
        steps:
          - task: AzureCLI@2
            displayName: 'Ensure Resource Group Exists'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: az group create --name $(rgName) --location ${{ parameters.location }}

          - task: AzureCLI@2
            displayName: 'Deploy Resources'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: |
                WORKSPACE_NAME=$(az deployment group create \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                  --query properties.outputs.mlWorkspaceName.value -o tsv)
                echo "##vso[task.setvariable variable=workspaceName]$WORKSPACE_NAME"

          - task: AzureCLI@2
            displayName: 'Smoke Test'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              inlineScript: az ml workspace show --name $(workspaceName) --resource-group $(rgName)